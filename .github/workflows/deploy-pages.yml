name: Deploy to GitHub Pages

# This replaces GitHub's built-in "pages build and deployment" workflow with a
# custom one we control. The built-in one hard-codes a 10-minute timeout on
# the final "wait for the deployment to go live" step — that's exactly what's
# been failing repeatedly ("Timeout reached, aborting!" at ~10 minutes every
# time). This version uses the same official actions but explicitly extends
# that wait to 30 minutes, so a slow/flaky moment on GitHub's Pages backend
# has room to actually finish instead of getting killed right as it's close.

on:
  push:
    branches: ["main"]
  workflow_dispatch: # lets you manually trigger a redeploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels whatever's still running
# instead of letting them collide.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000ms (10 min) — this is the exact thing timing out.
          # Raised to 30 minutes to give GitHub's backend real room to finish.
          timeout: 1800000
          error_count: 10
